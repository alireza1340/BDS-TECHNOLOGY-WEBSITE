<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BDS Technology Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0d10;
    --ink-2:#17191f;
    --slate:#2b2f36;
    --paper:#ffffff;
    --paper-2:#f4f3f1;
    --muted:rgba(244,243,241,.55);
    --line:rgba(255,255,255,.09);
    --red:#dd1a22;
    --red-deep:#b3141b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink)}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    font-family:"Inter",system-ui,sans-serif;
    color:var(--paper-2);
    padding:28px 16px;
    background:
      radial-gradient(900px 480px at 50% -10%, rgba(221,26,34,.09), transparent 62%),
      var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:400px;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
  }
  .card-top{
    padding:34px 28px 26px;
    text-align:center;
    background:linear-gradient(180deg, rgba(255,255,255,.025), transparent);
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .card-top::before{
    content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:64px;height:3px;background:var(--red);border-radius:0 0 3px 3px;
  }
  .logo{height:86px;width:auto;margin:0 auto 18px;display:block}
  h1{
    font-family:"Archivo",sans-serif;font-weight:900;font-size:27px;
    letter-spacing:.015em;line-height:1.05;color:#fff;text-wrap:balance;
  }
  h1 .t{color:var(--red)}
  .tagline{
    margin-top:11px;
    font-family:"Archivo",sans-serif;font-weight:700;font-size:11px;
    letter-spacing:.30em;text-transform:uppercase;color:var(--muted);
    display:inline-flex;align-items:center;gap:10px;
  }
  .tagline::before,.tagline::after{content:"";width:20px;height:2px;background:var(--red)}
  .contacts{padding:10px 16px;display:flex;flex-direction:column}
  .row{
    display:flex;align-items:center;gap:14px;
    padding:13px 12px;border-radius:12px;
    color:inherit;text-decoration:none;
    transition:background .2s;
  }
  .row:hover{background:rgba(255,255,255,.045)}
  .row + .row{border-top:1px solid var(--line)}
  .ic{
    flex:0 0 38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(221,26,34,.12);
  }
  .ic svg{width:18px;height:18px;stroke:var(--red);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ic svg.filled{fill:var(--red);stroke:none}
  .row .lbl{
    font-family:"Archivo",sans-serif;font-weight:700;font-size:10px;
    letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
    margin-bottom:3px;
  }
  .row .val{font-size:15px;font-weight:500;color:#fff;line-height:1.2;overflow-wrap:anywhere}
  .row .val.mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:14.5px}
  .qr-wrap{padding:8px 20px 20px}
  .qr-panel{
    background:var(--paper);
    border-radius:16px;
    padding:20px 20px 16px;
    text-align:center;
  }
  .qr-panel svg{width:100%;max-width:236px;height:auto;display:block;margin:0 auto}
  .qr-cap{
    margin-top:12px;
    font-family:"Archivo",sans-serif;font-weight:700;font-size:11px;
    letter-spacing:.24em;text-transform:uppercase;color:var(--ink);
    display:inline-flex;align-items:center;gap:8px;
  }
  .qr-cap svg{width:12px;height:14px;display:inline;margin:0}
  .actions{padding:0 20px 22px;display:flex;gap:10px}
  .btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:9px;
    font-family:"Archivo",sans-serif;font-weight:700;font-size:14px;
    padding:14px 10px;border-radius:12px;text-decoration:none;cursor:pointer;border:0;
    transition:background .2s,border-color .2s;
  }
  .btn-red{background:var(--red);color:#fff}
  .btn-red:hover{background:var(--red-deep)}
  .btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .foot{
    border-top:1px solid var(--line);
    padding:13px;text-align:center;
    font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--muted);
    letter-spacing:.06em;
  }
  @media (max-width:360px){ h1{font-size:23px} }
</style>
</head>
